services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - LLM_HOST=${LLM_HOST:-https://llm.ersensari.com}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - OCR_ENGINE=${OCR_ENGINE:-paddle}
      - DATA_DIR=/app/data
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - paddle_cache:/root/.cache/paddle
      - paddlex_cache:/root/.paddlex

  frontend:
    build: ./frontend
    ports:
      - "5174:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  paddle_cache:
  paddlex_cache:
